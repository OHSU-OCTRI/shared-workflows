name: Java Build and Publish

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version to use with the setup-java action
        type: string
        required: true
      publish_to_github_packages:
        description: Whether to publish to GitHub Packages
        type: boolean
        required: false
        default: false
      publish_to_maven_central:
        description: Whether to publish to Maven Central
        type: boolean
        required: false
        default: false
    secrets:
      MAVEN_GPG_PASSPHRASE:
        description: GPG passphrase to use to sign Maven artifacts
        required: true
      MAVEN_GPG_PRIVATE_KEY:
        description: GPG key to use to sign Maven artifacts
        required: true
      MAVEN_PASSWORD:
        description: Maven Central password to use to publish artifacts
        required: true
      MAVEN_USERNAME:
        description: Maven Central username to use to publish artifacts
        required: true

jobs:
  build-java-source:
    name: Build jar files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Activates the consumer pom profile that resolves OCTRI SNAPSHOTs from
      # GitHub Packages via setup-java's default `github` server
      OCTRI_GITHUB_SNAPSHOTS: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for GitHub Packages
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Used instead of setup-java's `cache: maven`, which has no fallback key and
      # re-downloads every dependency whenever a pom.xml changes. The cache is
      # only saved from the default branch; see the save step below.
      - name: Restore Maven repository
        id: restore-maven-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}--${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}--
            maven-${{ runner.os }}-

      - name: Build and test
        run: mvn -B -ntp package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload application JAR for container build
        if: vars.APP_JAR_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-jar
          path: target/${{ vars.APP_JAR_NAME }}
          overwrite: true
          retention-days: 3

      - name: Get version from POM
        id: get-version
        run: |
          version=$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$version" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_to_github_packages }}
        run: mvn -B -ntp deploy -DskipTests -Pci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # Keep this project's own artifacts out of the saved cache
      - name: Remove project artifacts from Maven cache
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.restore-maven-cache.outputs.cache-hit != 'true'
        run: mvn -B -ntp org.codehaus.mojo:build-helper-maven-plugin:3.6.1:remove-project-artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Caches saved from PR or tag refs can't be restored by other refs, so only
      # the default branch saves. An exact hit means this key already exists.
      - name: Save Maven repository
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.restore-maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}--${{ hashFiles('**/pom.xml') }}

  publish-to-maven-central:
    name: Publish to Maven Central
    needs: build-java-source
    if: ${{ inputs.publish_to_maven_central }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # OCTRI_GITHUB_SNAPSHOTS is deliberately not set here: setup-java only writes
    # the `central` server for this job, so resolving from GitHub Packages would
    # fail with a 401. SNAPSHOTs keep coming from Central's snapshot repository.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for Maven Central
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          mvn-server-repository-origins: |
            central:https://central.sonatype.com

      - name: Restore Maven repository
        id: restore-maven-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}--${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}--
            maven-${{ runner.os }}-

      - name: Publish release to Maven Central
        run: mvn -B -ntp deploy -DskipTests -Pci,publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # Keep this project's own artifacts out of the saved cache. This job
      # normally runs on release tags, where both steps are skipped.
      - name: Remove project artifacts from Maven cache
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.restore-maven-cache.outputs.cache-hit != 'true'
        run: mvn -B -ntp org.codehaus.mojo:build-helper-maven-plugin:3.6.1:remove-project-artifact

      - name: Save Maven repository
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.restore-maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}--${{ hashFiles('**/pom.xml') }}