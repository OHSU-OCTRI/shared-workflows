name: Java Build and Publish

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version to use with the setup-java action
        type: string
        required: true
      publish_to_github_packages:
        description: Whether to publish to GitHub Packages
        type: boolean
        required: false
        default: false
      publish_to_maven_central:
        description: Whether to publish to Maven Central
        type: boolean
        required: false
        default: false
    secrets:
      MAVEN_GPG_PASSPHRASE:
        description: GPG passphrase to use to sign Maven artifacts
        required: true
      MAVEN_GPG_PRIVATE_KEY:
        description: GPG key to use to sign Maven artifacts
        required: true
      MAVEN_PASSWORD:
        description: Maven Central password to use to publish artifacts
        required: true
      MAVEN_USERNAME:
        description: Maven Central username to use to publish artifacts
        required: true

jobs:
  build-java-source:
    name: Build jar files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for GitHub Packages
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Build and test
        run: mvn package

      - name: Upload application JAR for container build
        if: vars.APP_JAR_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-jar
          path: target/${{ vars.APP_JAR_NAME }}
          overwrite: true
          retention-days: 3

      - name: Get version from POM
        id: get-version
        run: |
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$version" >> $GITHUB_ENV

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_to_github_packages }}
        run: mvn deploy -DskipTests -Pci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-to-maven-central:
    name: Publish to Maven Central
    needs: build-java-source
    if: ${{ inputs.publish_to_maven_central }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for Maven Central
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish release to Maven Central
        run: mvn deploy -DskipTests -Pci,publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}