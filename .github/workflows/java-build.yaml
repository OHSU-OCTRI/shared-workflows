name: Java Build and Publish

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version to use with the setup-java action
        type: string
        required: true
      publish_to_github_packages:
        description: Whether to publish to GitHub Packages
        type: boolean
        required: false
        default: false
      publish_to_maven_central:
        description: Whether to publish to Maven Central
        type: boolean
        required: false
        default: false
    secrets:
      MAVEN_GPG_PASSPHRASE:
        description: GPG passphrase to use to sign Maven artifacts
        required: true
      MAVEN_GPG_PRIVATE_KEY:
        description: GPG key to use to sign Maven artifacts
        required: true
      MAVEN_PASSWORD:
        description: Maven Central password to use to publish artifacts
        required: true
      MAVEN_USERNAME:
        description: Maven Central username to use to publish artifacts
        required: true

jobs:
  build-java-source:
    name: Build jar files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for GitHub Packages
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          mvn-repositories: |
            github:https://maven.pkg.github.com/${{ github.repository_owner }}/*:true
          mvn-repositories-prioritize-central: false

      # The cache is shared with java-test-build.yaml and java-release.yaml. 
      # If java-test-build.yaml saved it, the deploy, gpg and help plugins and
      # any `ci` profile plugins may miss.
      - name: Restore Maven repository
        id: maven-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build and test
        run: mvn package

      - name: Upload application JAR for container build
        if: vars.APP_JAR_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-jar
          path: target/${{ vars.APP_JAR_NAME }}
          overwrite: true
          retention-days: 3

      - name: Get version from POM
        id: get-version
        run: |
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$version" >> $GITHUB_ENV

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_to_github_packages }}
        run: mvn deploy -DskipTests -Pci
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Prune Maven repository
        if: >-
          steps.maven-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          find ~/.m2/repository -type d -name '*-SNAPSHOT' -prune -exec rm -rf {} +
          find ~/.m2/repository -name '*.lastUpdated' -delete

      - name: Save Maven repository
        if: >-
          steps.maven-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

  publish-to-maven-central:
    name: Publish to Maven Central
    needs: build-java-source
    if: ${{ inputs.publish_to_maven_central }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for Maven Central
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          # Replaces server-id, which only supports a single server
          mvn-server-credentials: |
            central:MAVEN_USERNAME:MAVEN_PASSWORD
            github:GITHUB_ACTOR:GITHUB_TOKEN
          mvn-server-repository-origins: |
            central:https://central.sonatype.com
            github:https://maven.pkg.github.com
          # Resolve OCTRI dependencies from GitHub Packages before Maven Central
          mvn-repositories: |
            github:https://maven.pkg.github.com/${{ github.repository_owner }}/*:true
          mvn-repositories-prioritize-central: false

      - name: Restore Maven repository
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Publish release to Maven Central
        run: mvn deploy -DskipTests -Pci,publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}