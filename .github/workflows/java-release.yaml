# Maven cache: documented in README.md - review before modifying.
# * The release plugin and its SCM provider may miss.
name: Java Release

on:
  workflow_call:
    inputs:
      version:
        description: Version to release
        type: string
        required: true
      development_version:
        description: Next version to set in pom.xml after release. Suffix "-SNAPSHOT" is added automatically.
        type: string
        required: true
      java_version:
        description: Java version to use with the setup-java action
        type: string
        required: true

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Java build environment
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java_version }}
        mvn-repositories: |
          github:https://maven.pkg.github.com/${{ github.repository_owner }}/*:true
        mvn-repositories-prioritize-central: false

    - name: Restore Maven repository
      uses: actions/cache/restore@v5
      with:
        path: ~/.m2/repository
        key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: maven-${{ runner.os }}-

    - name: Set up Git
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: Update CHANGELOG.md
      id: update_changelog
      uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
      with:
        tag: v${{ inputs.version }}

    - name: Commit CHANGELOG.md
      run: |
        git add CHANGELOG.md
        git commit -m "Add version ${VERSION} to CHANGELOG.md"
      env:
        VERSION: ${{ inputs.version }}

    - name: Prepare Maven release
      run: |
        mvn -B \
          -Darguments=-DskipTests \
          -DautoVersionSubmodules=true \
          -DreleaseVersion="$VERSION" \
          -DscmReleaseCommitComment="Release version $VERSION" \
          -DdevelopmentVersion="${DEV_VERSION}-SNAPSHOT" \
          -DscmDevelopmentCommitComment="Next development version - $DEV_VERSION" \
          -Dtag="v${VERSION}" \
          -Dusername=${{ github.actor }} \
          -Dpassword=${{ secrets.GITHUB_TOKEN }} \
          release:prepare
      env:
        VERSION: ${{ inputs.version }}
        DEV_VERSION: ${{ inputs.development_version }}

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        body: ${{ steps.update_changelog.outputs.release-notes }}
        draft: false
        prerelease: false
        name: ${{ inputs.version }}
        tag_name: v${{ inputs.version }}
        generate_release_notes: false

    - name: Build release artifacts
      run: |
        gh workflow run build.yaml --ref "v${VERSION}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ inputs.version }}

    - name: Build snapshot artifacts
      run: |
        gh workflow run build.yaml --ref ${{ github.ref_name }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
