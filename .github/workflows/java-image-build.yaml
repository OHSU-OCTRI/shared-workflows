---
name: Build Java app image
on:
  workflow_call:
    inputs:
      platforms:
        description: "Comma-separated string of platforms to include in the image (default: linux/amd64,linux/arm64)."
        type: string
        required: false
        default: linux/amd64,linux/arm64

jobs:
  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into container registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: image_metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Download jar file
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}-jar
          path: target

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          tags: ${{ steps.image_metadata.outputs.tags }}
          labels: ${{ steps.image_metadata.outputs.labels }}
          platforms: ${{ inputs.platforms }}
