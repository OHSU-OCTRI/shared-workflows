name: Java Build

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version to use with the setup-java action
        type: string
        required: true

jobs:
  build-java-source:
    name: Build jar files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Credentials for the default `github` server, used to resolve packages
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for GitHub Packages
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven
          # Resolve OCTRI dependencies from GitHub Packages before Maven Central
          mvn-repositories: |
            github:https://maven.pkg.github.com/${{ github.repository_owner }}/*:true
          mvn-repositories-prioritize-central: false

      - name: Build and test
        run: mvn package