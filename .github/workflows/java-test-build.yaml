# Maven cache: documented in README.md - review before modifying.
name: Java Build

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version to use with the setup-java action
        type: string
        required: true

jobs:
  build-java-source:
    name: Build jar files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for GitHub Packages
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          mvn-repositories: |
            github:https://maven.pkg.github.com/${{ github.repository_owner }}/*:true
          mvn-repositories-prioritize-central: false

      - name: Restore Maven repository
        id: maven-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build and test
        run: mvn package
