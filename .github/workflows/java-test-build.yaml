name: Java Build

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version to use with the setup-java action
        type: string
        required: true

jobs:
  build-java-source:
    name: Build jar files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Activates the consumer pom profile that resolves OCTRI SNAPSHOTs from
      # GitHub Packages via setup-java's default `github` server
      OCTRI_GITHUB_SNAPSHOTS: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for GitHub Packages
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      # Used instead of setup-java's `cache: maven`, which has no fallback key and
      # re-downloads every dependency whenever a pom.xml changes. The cache is
      # only saved from the default branch; see the save step below.
      - name: Restore Maven repository
        id: restore-maven-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}--${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}--
            maven-${{ runner.os }}-

      - name: Build and test
        run: mvn -B -ntp package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep this project's own artifacts out of the saved cache
      - name: Remove project artifacts from Maven cache
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.restore-maven-cache.outputs.cache-hit != 'true'
        run: mvn -B -ntp org.codehaus.mojo:build-helper-maven-plugin:3.6.1:remove-project-artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Caches saved from PR or tag refs can't be restored by other refs, so only
      # the default branch saves. An exact hit means this key already exists.
      - name: Save Maven repository
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.restore-maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}--${{ hashFiles('**/pom.xml') }}
